<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 16" width="800" height="16" role="presentation">
  <!-- dot-dash divider, dark theme: accent green on transparent bg -->
  <line x1="0" y1="8" x2="800" y2="8" stroke="#0e4429" stroke-width="1" stroke-dasharray="4 10"/>
  <!-- accent dots every 80px -->
  <circle cx="80"  cy="8" r="2" fill="#39d353" opacity="0.5"/>
  <circle cx="160" cy="8" r="2" fill="#39d353" opacity="0.5"/>
  <circle cx="240" cy="8" r="2" fill="#39d353" opacity="0.5"/>
  <circle cx="320" cy="8" r="2" fill="#39d353" opacity="0.5"/>
  <circle cx="400" cy="8" r="2.5" fill="#39d353"/>
  <circle cx="480" cy="8" r="2" fill="#39d353" opacity="0.5"/>
  <circle cx="560" cy="8" r="2" fill="#39d353" opacity="0.5"/>
  <circle cx="640" cy="8" r="2" fill="#39d353" opacity="0.5"/>
  <circle cx="720" cy="8" r="2" fill="#39d353" opacity="0.5"/>
</svg>
