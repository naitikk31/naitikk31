name: Status widget

on:
  push:
    branches: [main]
  schedule:
    # every 3 hours — keeps the last-commit widget fresh
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fetch last public push event and render as a terminal-style SVG.
      # GITHUB_TOKEN gives 5 000 req/hour (vs 60 unauthenticated).
      - name: Generate last-commit status widget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/status.py \
            --user "${{ github.repository_owner }}" \
            -o assets/status

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/status-*.svg
          git diff --staged --quiet || git commit -m "chore: refresh status widget"
          git push
